<!doctype html>
<html lang="ind">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tukies — Getuk Cookies</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    />

    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Icon CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
  </head>

  <body>
    <!-- Header -->
    <header class="navbar">
      <div class="nav-container">
        <a href="#home" class="logo"
          ><img src="assets/logo.png" alt="tukies"
        /></a>

        <nav id="navMenu">
          <a href="#home" class="active"><span>Beranda</span></a>
          <a href="#varian"><span>Varian</span></a>
          <a href="#about"><span>Tentang</span></a>
          <a href="#review"><span>Ulasan</span></a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Home Section -->
      <section class="hero" id="home">
        <div class="container hero-container">
          <div class="hero-text">
            <div class="hero-heart"><i class="fas fa-heart"></i></div>
            <h1>
              TUKIES,<br />
              <span
                >Inovasi camilan<br />
                tradisional modern</span
              >
            </h1>

            <p class="hero-description">
              Perpaduan getuk singkong tradisional dengan sentuhan cookies
              modern yang crunchy.
            </p>

            <a href="#varian" class="btn"> Yuk, Cicipi! </a>
          </div>

          <div class="hero-image">
            <div class="hero-blob"></div>
            <div class="star"><i class="fas fa-star"></i></div>
            <div class="hero-slash"></div>
            <div class="hero-product">
              <img src="assets/product.jpg" alt="Produk Tukies" />
            </div>
            <div class="sticker tasty">Tasty!</div>
            <div class="sticker crunchy">Crunchy!</div>
          </div>
        </div>

        <div class="wave"></div>
      </section>

      <!-- Varian Section -->
      <section id="varian"></section>

      <!-- About Section -->
      <section id="about"></section>

      <!-- Review Section -->
      <section id="review"></section>

      <!-- Footer Section -->
      <footer></footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
